<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
        }
        .thank-you-container {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .thank-you-container img {
            width: 100px;
            margin-bottom: 20px;
        }
        .thank-you-container h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .thank-you-container p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        .thank-you-container a {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 5px;
        }
        .thank-you-container a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Thank You">
        <h1>Cảm ơn quý khách!</h1>
        <p>Quý khách đã đặt hàng thành công. Chúng tôi sẽ liên hệ sớm nhất để xác nhận và gửi hàng.</p>
        <a href="index copy.html">Quay lại trang chủ</a>
    </div>
</body>
</html>
