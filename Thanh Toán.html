<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #84fab0, #8fd3f4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .payment-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }

        .payment-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .payment-header h1 {
            margin: 0;
            font-size: 24px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #0056b3;
        }

        .secure-text {
            text-align: center;
            margin-top: 10px;
            color: #555;
            font-size: 14px;
        }

        .secure-text img {
            width: 20px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="payment-header">
            <h1>Thanh Toán</h1>
        </div>

        <form>
            <div class="input-group">
                <label for="card-number">Số Điện Thoại</label>
                <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
            </div>

            <div class="input-group">
                <label for="card-holder">Họ Tên</label>
                <input type="text" id="card-holder" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label for="expiry-date">Email</label>
                <input type="text" id="expiry-date" placeholder="MM/YY" required>
            </div>

            <div class="input-group">
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" placeholder="123" required>
            </div>
            
            <button type="submit " class="submit-btn">Xác Nhận</button>
            <div id="success-message" class="success-message">Thanh toán thành công!Cảm ơn bạn đã đặt hàng.</div>
            <button type="submit" class="submit-btn">Hủy Đặt</button>
            <div id="success-message" class="success-message">Hủy đặt hàng thành công!Cảm  ơn quý khách.</div>

            <div class="secure-text">
                <img src="https://img.icons8.com/material-outlined/24/000000/lock--v1.png" alt="Secure"> 
                
            </div>
        </form>
    </div>
</body>
</html>
